[project]
name = "scrape"
version = "0.1.0"
description = "Tiered escalating web scraper with anti-bot bypass, residential proxies, CAPTCHA solving, and AI extraction."
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["scraping", "anti-bot", "cloudflare", "captcha", "proxies", "data-extraction"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.7.4",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "redis>=5.0",
    "tenacity>=9.0",
    "anyio>=4.4",
    "typer>=0.12",
    "rich>=13.7",
    "playwright>=1.46",
    "anthropic>=0.39",
    "aiosqlite>=0.20",
    "prometheus-client>=0.21",
    "tldextract>=5.1",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.11",
]

[project.scripts]
scrape = "scrape.cli:app"
scrape-api = "scrape.api.main:run"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
# E501: long lines handled by formatter; B006: typer requires list defaults;
# B008: FastAPI's dependency injection intentionally uses calls in defaults;
# RUF002/003: unicode in prose docstrings is intentional.
ignore = ["E501", "B006", "B008", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrape"]
