services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["scrape-api"]
    env_file: ../.env
    environment:
      SCRAPE_API_HOST: 0.0.0.0
      SCRAPE_API_PORT: "8000"
      SCRAPE_CORS_ORIGINS: http://localhost:3000,http://web:3000
      SCRAPE_JWT_SECRET: ${SCRAPE_JWT_SECRET:-dev-only-change-me-please}
      STORAGE_SQLITE_PATH: /data/scrape.db
      STORAGE_RAW_HTML_DIR: /data/raw
    volumes:
      - scrape_data:/data
    ports: ["8000:8000"]

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    environment:
      SCRAPE_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9091:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards

volumes:
  scrape_data: {}
  redis_data: {}
  grafana_data: {}
